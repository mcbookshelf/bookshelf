[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcbookshelf"
version = "5.0.0"
description = "A modular library datapack for Minecraft mapmakers."
readme = "README.md"
authors = [{ name = "Bookshelf Contributors", email = "contact@gunivers.net" }]
license = { text = "MPL-2.0" }
requires-python = ">=3.14"
dependencies = ["beet>=0.119.1"]

[project.urls]
Homepage = "https://mcbookshelf.dev"
Documentation = "https://docs.mcbookshelf.dev"
Repository = "https://github.com/mcbookshelf/bookshelf"

[dependency-groups]
dev = ["mcbookshelf-tools"]
docs = [
  "linkify-it-py>=2.2.0",
  "myst-parser>=5.1.0",
  "sphinx-breeze-theme>=0.13.2",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7.0",
  "sphinx-intl>=2.4.0",
  "sphinx-minecraft>=1.0.5",
  "sphinx>=9.1.0",
  "sphinxcontrib.mermaid>=2.1.1",
]

[tool.uv]
package = true
default-groups = "all"

[tool.uv.workspace]
members = ["tools"]

[tool.uv.sources]
mcbookshelf-tools = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mcbookshelf"]

[tool.ruff]
src = ["src", "tools", "."]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY001",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107",
  "D203",
  "D213",
  "D401",
  "EM101",
  "EM102",
  "INP001",
  "S603",
  "TC001",
  "TC002",
  "TC003",
  "TRY003",
  "TRY400",
  "UP017",
]

[coverage]
minimum = { namespace = 85 }
ignore = [
  "*:*__help__",
  "*:*__load__",
  "*:*__unload__",
  "bs.load:*",
  "load:*",
  # generated by the plugins
  { kind = "context_int_provider", id = "bs.hitbox:_get_block/collision/index" },
  { kind = "context_int_provider", id = "bs.hitbox:_get_block/outline/index" },
  { kind = "context_int_provider", id = "bs.hitbox:_get_block/offset/*" },
  { kind = "context_int_provider", id = "bs.hitbox:_get_block/seed*" },
  { kind = "context_int_provider", id = "bs.hitbox:_get_entity/*" },
  { kind = "context_int_provider", id = "bs.hitbox:_overlaps/*" },
  { kind = "context_float_provider", id = "bs.hitbox:_overlaps/*" },
  { kind = "predicate", id = "bs.hitbox:_overlaps/*" },
  { kind = "predicate", id = "bs.hitbox:_is_in_block/inside" },
  { kind = "predicate", id = "bs.hitbox:_is_in_entity/inside" },
  { kind = "context_int_provider", id = "bs.raycast:_b/*" },
  { kind = "context_float_provider", id = "bs.raycast:_b/*" },
  { kind = "context_int_provider", id = "bs.raycast:_e/*" },
  { kind = "context_float_provider", id = "bs.raycast:_e/*" },
  { kind = "context_int_provider", id = "bs.raycast:_cast/*" },
  { kind = "context_int_provider", id = "bs.raycast:_pierce/b/*" },
  { kind = "context_int_provider", id = "bs.raycast:_pierce/e/*" },
  { kind = "context_int_provider", id = "bs.raycast:_pierce/start" },
  { kind = "context_int_provider", id = "bs.raycast:_pierce/grow" },
]

name: 🔖 Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  info:
    name: 🔎 Release info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      game_version: ${{ steps.info.outputs.game_version }}
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Read release info
        id: info
        run: uv run info
      - name: Check release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.info.outputs.tag }}" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: 📦 Stable release
    needs: info
    if: needs.info.outputs.released == 'false'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/cache@v6
        with:
          path: .beet_cache
          key: ${{ runner.os }}-beet-cache-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-beet-cache-
      - name: Check versions
        run: uv run bump --check
      - name: Build packs
        run: uv run release
      - name: Write release notes
        run: uv run notes --output build/NOTES.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.info.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/*.zip release/manifest.json --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Release v${{ needs.info.outputs.version }} (Minecraft ${{ needs.info.outputs.game_version }})" \
              --notes-file build/NOTES.md \
              --latest \
              release/*.zip release/manifest.json
          fi
      - name: Move version tag and latest branch
        run: |
          git tag -f "v${{ needs.info.outputs.version }}"
          git push -f origin "v${{ needs.info.outputs.version }}" "$GITHUB_SHA:refs/heads/latest"

  publish:
    name: 🚀 Publish
    needs: [info, release]
    uses: ./.github/workflows/publish-packs.yml
    with:
      tag: ${{ needs.info.outputs.tag }}
    secrets: inherit

  nightly:
    name: 🌙 Nightly release
    needs: info
    if: needs.info.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/cache@v6
        with:
          path: .beet_cache
          key: ${{ runner.os }}-beet-cache-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-beet-cache-
      - name: Build packs
        run: uv run release --all
      - name: Write release notes
        run: uv run notes --unreleased --output build/NOTES.md
      - name: Replace release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (Minecraft ${{ needs.info.outputs.game_version }})" \
            --notes-file build/NOTES.md \
            release/*.zip release/manifest.json

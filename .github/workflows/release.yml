name: 🏷️ Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  info:
    name: 🔎 Release info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      tag_exists: ${{ steps.info.outputs.tag_exists }}
      game_version: ${{ steps.info.outputs.game_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Read release info
        id: info
        run: uv run info

  release:
    name: 📦 Stable release
    needs: info
    if: needs.info.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/cache@v6
        with:
          path: .beet_cache
          key: ${{ runner.os }}-beet-cache
      - name: Check versions
        run: uv run bump --check
      - name: Build packs
        run: uv run release
      - name: Write release notes
        run: uv run notes --output build/NOTES.md
      - name: Push tags
        run: |
          git tag "${{ needs.info.outputs.tag }}"
          git tag -f "v${{ needs.info.outputs.version }}"
          git push origin "${{ needs.info.outputs.tag }}"
          git push -f origin "v${{ needs.info.outputs.version }}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.info.outputs.tag }}" \
            --title "Release v${{ needs.info.outputs.version }} (Minecraft ${{ needs.info.outputs.game_version }})" \
            --notes-file build/NOTES.md \
            --latest \
            release/*.zip release/manifest.json
      - name: Publish to stores
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          SMITHED_TOKEN: ${{ secrets.SMITHED_TOKEN }}
        run: uv run publish
      - name: Move latest branch
        run: git push -f origin "$GITHUB_SHA:refs/heads/latest"

  nightly:
    name: 🌙 Nightly release
    needs: info
    if: needs.info.outputs.tag_exists == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/cache@v6
        with:
          path: .beet_cache
          key: ${{ runner.os }}-beet-cache
      - name: Build packs
        run: uv run release --all
      - name: Write release notes
        run: uv run notes --unreleased --output build/NOTES.md
      - name: Replace release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (Minecraft ${{ needs.info.outputs.game_version }})" \
            --notes-file build/NOTES.md \
            release/*.zip release/manifest.json

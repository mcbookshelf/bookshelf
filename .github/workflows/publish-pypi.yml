name: 🐍 Publish to PyPI

on:
  push:
    branches: [master]
    paths:
      - pyproject.toml
      - src/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: 🐍 Publish package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Publish to PyPI
        run: |
          version="$(uv version --short)"
          if curl -sfo /dev/null "https://pypi.org/pypi/mcbookshelf/$version/json"; then
            echo "mcbookshelf $version is already on PyPI"
            exit 0
          fi
          uv build
          uv publish

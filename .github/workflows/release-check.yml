name: "🔖 Release: check"

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 🔎 Check release
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check master
        run: |
          if ! git merge-base --is-ancestor origin/master ${{ github.event.pull_request.head.sha }}; then
            echo "::error::master moved since this release was prepared: dispatch the release again"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Check versions
        run: uv run bump --check

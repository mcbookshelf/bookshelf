name: ✨ Feature request
description: A new feature, or a change to one.
type: ✨ Feature
labels:
  - ✨ Feature

body:
  - type: input
    attributes:
      label: 🧩 Module
      description: The module the feature belongs to.
      placeholder: bs.example
    validations:
      required: true

  - type: input
    attributes:
      label: ⭐ Feature
      description: The feature to change, or a name for a new one, if you have one in mind.
      placeholder: "#bs.example:function"

  - type: textarea
    attributes:
      label: 🎯 Use case
      description: What you are trying to do in your project, and why the current features fall short.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 📝 Description
      description: A clear explanation of what the feature does.
    validations:
      required: true

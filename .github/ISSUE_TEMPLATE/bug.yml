name: 🐛 Bug report
description: Report a reproducible bug to help us investigate and fix it.
type: 🐛 Bug
labels:
  - 🐛 Bug

body:
  - type: input
    attributes:
      label: 🧩 Module
      description: The affected module.
      placeholder: bs.example
    validations:
      required: true

  - type: input
    attributes:
      label: 🔢 Version
      description: The module version where the bug occurs.
      placeholder: v5.0.0+26.3
    validations:
      required: true

  - type: input
    attributes:
      label: ⭐ Feature
      description: The affected feature, if applicable.
      placeholder: "#bs.example:function"

  - type: textarea
    attributes:
      label: ❌ Current behavior
    validations:
      required: true

  - type: textarea
    attributes:
      label: ✅ Expected behavior
    validations:
      required: true

  - type: textarea
    attributes:
      label: 🔁 Steps to reproduce
      description: The steps needed to reproduce the issue.
      placeholder: |
        1. /function #bs.xp:set_levels {levels: 5}
        2. /function #bs.xp:add_levels {levels: -10}
        3. The level shows 5 instead of 0.

  - type: textarea
    attributes:
      label: 💡 Notes
      description: Anything else that may help, such as a suspected cause or workaround.

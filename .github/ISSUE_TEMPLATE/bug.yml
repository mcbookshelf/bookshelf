name: 🐛 Bug report
description: Report a reproducible bug to help us investigate and fix it.
type: 🐛 Bug
labels:
  - 🐛 Bug

body:
  - type: input
    attributes:
      label: 🧩 Module or feature
      description: The affected feature, or its module if you cannot tell which feature.
      placeholder: "#bs.example:function"
    validations:
      required: true

  - type: input
    attributes:
      label: 🔢 Version
      description: The version of the module, listed in game by `/function #bs.load:status`.
      placeholder: 5.0.0
    validations:
      required: true

  - type: input
    attributes:
      label: 🎮 Minecraft version
      placeholder: "26.3"
    validations:
      required: true

  - type: textarea
    attributes:
      label: 🔁 Steps to reproduce
      description: The steps needed to reproduce the issue.
      placeholder: |
        1. /function #bs.xp:set_levels.in {levels: 5}
        2. /function #bs.xp:add_levels.in {levels: -10}
        3. The level shows 5 instead of 0.
    validations:
      required: true

  - type: textarea
    attributes:
      label: ❌ Current behavior
    validations:
      required: true

  - type: textarea
    attributes:
      label: ✅ Expected behavior
    validations:
      required: true

  - type: textarea
    attributes:
      label: 💡 Notes
      description: Anything else that may help, such as a suspected cause or workaround.

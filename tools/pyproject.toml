[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcbookshelf-tools"
version = "0"
description = "Commands to work on the Bookshelf repository."
requires-python = ">=3.14"
dependencies = [
  "mcbookshelf",
  "click>=8.5.0",
  "httpx[http2]>=0.28.1",
  "jinja2>=3.1.6",
  "lark>=1.3.1",
  "lectern>=0.35.0",
  "mcward[beet]>=1.4.0",
  "orjson>=3.12.0",
  "rich>=15.0.0",
  "watchfiles>=1.3.0",
]

[project.scripts]
build = "mcbookshelf.cli.build:build"
bump = "mcbookshelf.cli.bump:bump"
check = "mcbookshelf.cli.check:check"
docs = "mcbookshelf.cli.docs:docs"
info = "mcbookshelf.cli.info:info"
link = "mcbookshelf.cli.link:link"
notes = "mcbookshelf.cli.notes:notes"
publish = "mcbookshelf.cli.publish:publish"
release = "mcbookshelf.cli.release:release"
test = "mcbookshelf.cli.test:test"
watch = "mcbookshelf.cli.build:watch"

[tool.uv.sources]
mcbookshelf = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["mcbookshelf"]
